server:
  port: 8080

spring:
  application:
    name: english-app-backend

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/english_app?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root

  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  web:
    resources:
      static-locations: file:${user.home}/english-app-uploads/,classpath:/static/

# MyBatis Plus
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.english.app.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT
jwt:
  secret: english-app-jwt-secret-key-2024-extended!
  expiration: 86400000

# WeChat
wechat:
  appId: your-app-id
  appSecret: your-app-secret
  mchId: your-mch-id
  mchKey: your-mch-key
  notifyUrl: https://your-domain.com/api/payment/notify

# 文件上传
app:
  upload:
    dir: ${user.home}/english-app-uploads
    base-url: http://192.168.8.143:8080

# CORS（开发模式：允许局域网所有来源）
cors:
  allowed-origins: "*"

logging:
  level:
    com.english.app: debug
